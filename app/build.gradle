plugins {
    id 'com.android.application'
}

// -----------------------------------------------------------------------------
// Configuracion de firma.
// Lee key.properties (raiz del proyecto). Si no existe, cae de vuelta a la
// keystore de debug para que la compilacion NUNCA falle.
// -----------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseSigning = keystoreProperties['storeFile'] != null
}

android {
    namespace 'com.tuempresa.citasmedicas'
    compileSdk 34

    defaultConfig {
        applicationId "com.tuempresa.citasmedicas"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "6.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // Habilita los TRES esquemas de firma para maxima compatibilidad de
            // instalacion (v1 JAR + v2 + v3). Sin v1, algunos instaladores y
            // navegadores rechazan el APK con "Aplicacion no instalada".
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firmamos el RELEASE con la keystore de release propia (instalable y
            // estable entre builds). Si no se encontro key.properties, usamos la
            // keystore de debug para no romper la compilacion en CI.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // El plugin de AGP 8.x genera APKs con zipalign/APK Signature Scheme v2/v3.
    // La firma v1 tambien se habilita por compatibilidad con Android < 7.
    buildFeatures {
        viewBinding true
        // Necesario para BuildConfig: expone la configuracion de Firebase
        // (leida de local.properties) como constantes de Java.
        buildConfig true
    }

    // ── Nombre del APK ──────────────────────────────────────────────────────
    // Los enlaces del README y de PROBAR_APP apuntan a
    //   /releases/download/vX.Y/CitasMedicas-vX.Y.apk
    // Por defecto AGP genera "app-release.apk", así que la release publicaba un
    // archivo con otro nombre y los enlaces daban 404. Aquí se le pone el nombre
    // que esperan esos enlaces, tomado de versionName: un solo sitio que cambiar.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = "CitasMedicas-v${variant.versionName}.apk"
            }
        }
    }

    lint {
        // Supresiones documentadas en app/lint.xml (versiones ancladas + overdraw).
        lintConfig file("lint.xml")
        abortOnError true
        checkReleaseBuilds false
    }

    // ── Configuración de Firebase ────────────────────────────────────────────
    // Prioridad de las credenciales (la primera que exista gana):
    //
    //   1. Variable de entorno  -> útil para CI y para no tocar ficheros.
    //   2. local.properties     -> cada desarrollador, ignorado por git.
    //   3. firebase.properties  -> VERSIONADO en el repo.
    //
    // El punto 3 es imprescindible: GitHub Actions no tiene local.properties
    // (está en .gitignore), así que sin él el APK compilado en CI saldría en
    // MODO MOCK: funcionaría, pero las citas no llegarían a Firestore. Con
    // firebase.properties el APK descargado de Actions ya viene conectado.
    //
    // Nota de seguridad: la API Key de Firebase es una clave pública de
    // cliente; su función es IDENTIFICAR el proyecto, no autorizar el acceso.
    // La seguridad real la dan las Reglas de Firestore del servidor.
    def firebaseProps = new Properties()
    def firebasePropsFile = rootProject.file("firebase.properties")
    if (firebasePropsFile.exists()) {
        firebasePropsFile.withInputStream { firebaseProps.load(it) }
    }
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { firebaseProps.load(it) }
    }
    // Valor efectivo: variable de entorno > local.properties > firebase.properties
    def fbApiKey    = System.getenv("FIREBASE_API_KEY")     ?: firebaseProps.getProperty("FIREBASE_API_KEY", "")
    def fbProjectId = System.getenv("FIREBASE_PROJECT_ID")  ?: firebaseProps.getProperty("FIREBASE_PROJECT_ID", "")
    def fbAppId     = System.getenv("FIREBASE_APP_ID")      ?: firebaseProps.getProperty("FIREBASE_APP_ID", "")
    def fbSenderId  = System.getenv("FIREBASE_SENDER_ID")   ?: firebaseProps.getProperty("FIREBASE_SENDER_ID", "")
    // Nombre de la base de Firestore. Casi siempre es "(default)", pero el asistente
    // de creación permite cambiarlo; si se cambia y no se refleja aquí, todas las
    // peticiones devolverían 404 sin motivo aparente.
    def fbDatabaseId = System.getenv("FIREBASE_DATABASE_ID") ?: firebaseProps.getProperty("FIREBASE_DATABASE_ID", "")

    defaultConfig {
        buildConfigField "String", "FIREBASE_API_KEY",    "\"${fbApiKey}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${fbProjectId}\""
        buildConfigField "String", "FIREBASE_APP_ID",     "\"${fbAppId}\""
        buildConfigField "String", "FIREBASE_SENDER_ID",  "\"${fbSenderId}\""
        buildConfigField "String", "FIREBASE_DATABASE_ID", "\"${fbDatabaseId}\""
        // Interruptor global: sólo se conecta si hay projectId + apiKey.
        buildConfigField "boolean", "FIREBASE_ENABLED",
                "${(!fbApiKey.isEmpty() && !fbProjectId.isEmpty())}"
    }

    // Compatible con JDK 21: compilamos bytecode para Java 17 (soportado por Android)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // minSdk es 24, pero java.time exige API 26: el desugaring reescribe esas
        // llamadas para que funcionen desde API 24 sin subir el minSdk.
        coreLibraryDesugaringEnabled true
    }

    testOptions {
        // Robolectric necesita los recursos de Android reales para inflar layouts.
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Maven Central aplica rate-limit (HTTP 429) al bajar los android-all
                // de Robolectric. Se fuerza el mirror de Google, que sirve los mismos
                // artefactos sin límite. Sin esto la suite falla de forma intermitente.
                systemProperty 'robolectric.dependency.repo.url',
                        'https://maven-central.storage-download.googleapis.com/maven2'
                systemProperty 'robolectric.logging', 'stdout'
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // AndroidX core / lifecycle (MVVM)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // Room (persistencia local de citas)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit + Gson (capa de red simulada con MockInterceptor)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    // InstantTaskExecutorRule: hace que LiveData/Room emitan en los tests.
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Permite usar java.time (LocalDate) desde API 24 (minSdk) en lugar de API 26.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
