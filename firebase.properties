# ---------------------------------------------------------------------------
# Configuracion de Firebase del proyecto — VERSIONADA A PROPOSITO
# ---------------------------------------------------------------------------
#
# ¿Por que esta en el repositorio y no en local.properties?
#
#   GitHub Actions no tiene local.properties (esta en .gitignore) y no se le
#   pueden pasar ficheros, asi que el APK que se genera automaticamente
#   saldria en MODO MOCK: arrancaria bien, pero las citas NO se guardarian en
#   Firestore. Versionando este fichero, el APK descargado de Actions ya sale
#   conectado, sin configurar nada.
#
# ¿Es seguro?
#
#   La API Key de Firebase es una clave PUBLICA de cliente. No es un secreto:
#   su funcion es identificar el proyecto ante Google, no autorizar el acceso.
#   La seguridad real la imponen las Reglas de Firestore en el servidor. Es el
#   mismo dato que viaja, en claro, dentro de cualquier APK de Play Store.
#
#   Aun asi, este fichero NO debe contener contrasenas, tokens privados ni
#   claves de cuenta de servicio.
#
# Prioridad de lectura en app/build.gradle (la primera que exista gana):
#   1. Variable de entorno  FIREBASE_*
#   2. local.properties     (ignorado por git, para pruebas locales)
#   3. este fichero         (valor por defecto versionado)
#
# ---------------------------------------------------------------------------

FIREBASE_PROJECT_ID=citas-medicas-e19ca
FIREBASE_API_KEY=AIzaSyD5nsBLQbkTE6XlxJhgILT2yuiWMEhIYJA
FIREBASE_APP_ID=1:1089054062710:android:7ce90d552c8ff466c04757
FIREBASE_SENDER_ID=1089054062710

# Nombre de la base de Firestore. El asistente de creacion permite cambiarlo;
# si algun dia se renombra, hay que actualizar esta linea o todas las
# peticiones devolveran 404 sin motivo aparente.
FIREBASE_DATABASE_ID=(default)
